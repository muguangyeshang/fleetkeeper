[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetkeeper"
version = "0.2.0"
description = "Self-healing watchdog for local AI service fleets: network-gated healing with per-port cooldowns, deadman-switch heartbeats, L0-L4 canary probes, outbound alerts, an incident timeline, and an offline HTML status page. Pure standard library."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "muguangyeshang" }]
keywords = [
    "watchdog", "llm", "ollama", "comfyui", "llama.cpp", "observability",
    "heartbeat", "canary", "self-healing", "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/muguangyeshang/fleetkeeper"
Repository = "https://github.com/muguangyeshang/fleetkeeper"
Issues = "https://github.com/muguangyeshang/fleetkeeper/issues"
Changelog = "https://github.com/muguangyeshang/fleetkeeper/blob/main/CHANGELOG.md"
Security = "https://github.com/muguangyeshang/fleetkeeper/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "coverage>=7"]

[project.scripts]
fleetkeeper = "fleetkeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Lint settings live here so a contributor gets the same verdict as CI.
# E501 is off on purpose: this code carries long explanatory comments.
[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
